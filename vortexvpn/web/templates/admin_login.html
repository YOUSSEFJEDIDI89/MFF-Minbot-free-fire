<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>·</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body class="auth-body">
  <div class="auth-card admin-auth-card">
    <div class="logo admin-logo">⚡</div>
    <h1>لوحة الإدارة</h1>
    <p class="muted-small">دخول المشرفين فقط</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" autocomplete="off">
      <label>اسم المستخدم
        <input type="text" name="username" required autofocus>
      </label>
      <label>كلمة المرور
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn-primary">دخول الإدارة</button>
    </form>
    <p class="muted">⚠️ منطقة محظورة · جميع المحاولات مسجّلة</p>
  </div>
</body>
</html>
